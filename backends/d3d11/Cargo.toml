[package]
name = "reconl-backend-d3d11"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib"]

[dependencies]
reconl-core = { path = "../../core" }
reconl-raster = { path = "../../raster" }
reconl-shadow = { path = "../../shadow" }
reconl-contract = { path = "../../contract" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Hlsl",
    "Win32_System_LibraryLoader",
] }
